name: Release v1.15.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v1.15.0.yml"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: |
          npm test
          npm run typecheck
          npm run verify-notes
          node scripts/pipeline-image-test.mjs

      - name: Version, commit, and tag
        env:
          VERSION: "1.15.0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          CURRENT="$(node -p "require('./package.json').version")"
          echo "current=$CURRENT target=$VERSION"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists"
          else
            npm version "$VERSION" -m "chore(release): %s"
            git push origin HEAD:main --follow-tags
          fi

      - name: Resolve release commit
        id: release_meta
        run: |
          RELEASE_SHA="$(git rev-list -n 1 v1.15.0)"
          SHORT_SHA="$(printf '%s' "$RELEASE_SHA" | cut -c1-7)"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Inject version into frontend
        run: |
          git checkout v1.15.0 -- package.json package-lock.json
          node scripts/inject-version.mjs --version "1.15.0" --repo "https://github.com/${{ github.repository }}"
          node -e "const fs=require('fs');const p='dashboard/version.json';const j=JSON.parse(fs.readFileSync(p));j.commit='${{ steps.release_meta.outputs.sha }}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\\n')"
          cat dashboard/version.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:1.15.0
            ghcr.io/${{ github.repository }}:1.15
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ steps.release_meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.15.0 >/dev/null 2>&1; then
            echo "release v1.15.0 already exists"
          else
            gh release create v1.15.0 \
              --title "v1.15.0 — Universal tool-name virtualization" \
              --generate-notes \
              --verify-tag
          fi
